[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[project]
name = "app"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "arq>=0.28.0",
    "azure-communication-email>=1.0.0",
    "beautifulsoup4>=4.14.3",
    "curl-cffi>=0.15.0",
    "fastapi>=0.135.1",
    "httpx[http2]>=0.28.1",
    "ifcopenshell>=0.8.3",
    "langchain-core>=1.0.0",
    "langchain-openai>=1.0.0",
    "lxml>=6.1.1",
    "numpy>=2.4.2",
    "openai>=2.16.0",
    "pandas>=3.0.0",
    "playwright>=1.60.0",
    "pypdf>=6.1.0",
    "python-multipart>=0.0.20",
    "pydantic-settings>=2.13.1",
    "redis[asyncio]>=5.3.1",
    "trafilatura>=2.0.0",
    "uvicorn>=0.40.0",
]

[dependency-groups]
dev = [
    "pytest>=8.4.2",
    "pytest-cov>=7.0.0",
]

[project.scripts]
obra-barata-api = "app.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/app"]

[tool.pytest.ini_options]
addopts = [
    "--cov=app",
    "--cov-branch",
    "--cov-report=term-missing:skip-covered",
    "--cov-fail-under=100",
]
testpaths = ["tests/unit"]
python_files = ["test_*.py"]

[tool.coverage.run]
branch = true
source = ["app"]

[tool.coverage.report]
fail_under = 100
show_missing = true
skip_covered = true
