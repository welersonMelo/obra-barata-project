services:
   
  backend:
    build:
      context: backend/api/.
      dockerfile: Dockerfile
    image: ${PROJECT_NAME}-${DEPLOY_ENV}-backend-img
    container_name: ${PROJECT_NAME}-${DEPLOY_ENV}-backend
    env_file:
      - .env
    command: uv run uvicorn app.app:app --host 0.0.0.0 --port 8000
    volumes:
      - ./logs:/logs
      - ./data:/data
    restart: always
    networks:
      - shared_network

  frontend:
    build:
      context: frontend/.
      dockerfile: Dockerfile
    image: ${PROJECT_NAME}-${DEPLOY_ENV}-frontend-img
    container_name: ${PROJECT_NAME}-${DEPLOY_ENV}-frontend
    command: sh -c "npm run preview -- --port=3000 --host"
    networks:
      - shared_network
    depends_on:
      - backend
    environment:
      - NODE_ENV=production
      - VITE_API_BASE_URL=/api
  
  nginx-proxy:
    build:
      context: nginx/.
      dockerfile: Dockerfile
    image: ${PROJECT_NAME}-${DEPLOY_ENV}-nginx-img
    container_name: ${PROJECT_NAME}-${DEPLOY_ENV}-nginx
    depends_on:
      - backend
      - frontend
    ports:
      - "80:80"      
    environment:
      - ROOT_PATH_BACKEND=${ROOT_PATH_BACKEND}    
      - NGINX_ENVSUBST_OUTPUT_DIR=/etc/nginx
      - FRONTEND_SERVICE=frontend
      - BACKEND_SERVICE=backend
    networks:
      - shared_network
    restart: always

networks:
  shared_network:
    name: ${PROJECT_NAME}-${DEPLOY_ENV}-network
    driver: bridge
